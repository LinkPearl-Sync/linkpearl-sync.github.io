# Les actions sont épinglées par empreinte de commit : sans Dependabot, elles
# ne bougeraient plus jamais, correctifs de sécurité compris. Il propose la
# nouvelle empreinte en pull request, avec la version en commentaire, et un
# humain la relit avant de la fusionner.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
